version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: mariadb_practica
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: TuContraseñaSegura
      MYSQL_DATABASE: practica-db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mariadb_data:
